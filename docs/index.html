<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Atlantis Transport – Fuel Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --green:#1e9e4a; --amber:#f0a020; --red:#d63a2f; --grey:#8a8f98; --ink:#1d232b; --panel:#ffffffee;
          --brand:#000000; --brand-ink:#ffffff; --accent:#ffe058; --bar:54px; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; top:var(--bar); left:0; right:0; bottom:0; background:#e4e6e8; }

  #map .leaflet-tile-pane { filter:grayscale(1) brightness(1.04) contrast(.92); }
  #bar { position:absolute; top:0; left:0; right:0; height:var(--bar); box-sizing:border-box; z-index:1003; display:flex; align-items:center;
         gap:8px; padding:8px 10px; background:var(--brand); color:var(--brand-ink); box-shadow:0 2px 8px #0004; border-bottom:3px solid var(--accent); }
  #menuBtn { position:relative; flex:none; width:40px; height:38px; padding:0; font-size:20px; line-height:1; background:transparent;
             color:var(--brand-ink); border:1.5px solid color-mix(in srgb, var(--brand-ink) 45%, transparent); }
  #menuBtn:hover { background:color-mix(in srgb, var(--brand-ink) 12%, transparent); }
  #menuBtn .nf { position:absolute; top:-6px; right:-6px; }
  #brand { flex:none; display:flex; align-items:center; gap:8px; min-width:0; max-width:34%; }
  #brand img { max-height:38px; max-width:160px; object-fit:contain; }
  #search { flex:1; min-width:0; max-width:420px; margin-left:auto; padding:8px 10px; border:0; border-radius:8px; font-size:15px; }
  #locate { flex:none; height:38px; }
  #drawer { position:absolute; top:var(--bar); right:0; bottom:0; width:290px; max-width:86vw; box-sizing:border-box; z-index:1002;
            background:#fff; box-shadow:-2px 0 12px #0003; padding:12px 14px 18px; overflow-y:auto;
            transform:translateX(105%); transition:transform .2s ease; font-size:14px; }
  #menuBtn { order:10; }   /* PC: menu button sits on the right, next to the menu */
  #drawer.open { transform:none; }
  #drawer .dhead { display:flex; align-items:center; font-weight:800; font-size:15px; margin-bottom:2px; }
  #drawer .dhead button { margin-left:auto; border:0; background:none; font-size:18px; padding:2px 6px; color:#556; }
  #scrim { position:absolute; inset:var(--bar) 0 0 0; z-index:1001; background:#0005; display:none; }
  .nf { font-size:11px; font-weight:700; color:#fff; background:#d63a2f; border-radius:9px; padding:1px 6px; line-height:1.4; }
  .panel { position:absolute; z-index:1000; background:var(--panel); border-radius:10px;
           box-shadow:0 2px 10px #0003; padding:10px 12px; font-size:14px; }
  button { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid #ccd; background:#fff; cursor:pointer; }
  button:hover { background:#f1f4f7; }
  #drawer .lh { font-size:12px; color:#556; margin:12px 0 5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .chips { display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; }
  .chip { cursor:pointer; --c:#111; }
  .chip.c-unl { --c:#00843d; } .chip.c-adblue { --c:#0067b1; } .chip.c-ev { --c:#0f8f8a; }
  .chip input { position:absolute; opacity:0; pointer-events:none; }
  .chip span { display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 4px; border-radius:8px; font-size:13px;
               font-weight:700; border:2px solid var(--c); color:var(--c); background:#fff; user-select:none; white-space:nowrap; }
  .chip span svg { width:16px; height:16px; flex:none; }
  .chip input:checked + span { background:var(--c); color:#fff; box-shadow:0 1px 3px #0003; }
  .chip input:focus-visible + span { outline:2px solid #1a73e8; outline-offset:2px; }
  .seg { display:grid; grid-template-columns:repeat(2, 1fr); border:2px solid #c9d0d8; border-radius:8px; overflow:hidden; }
  .seg label { cursor:pointer; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span { display:block; text-align:center; padding:6px 2px; font-size:12px; font-weight:600; color:#55606c; background:#fff; }
  .seg label + label span { border-left:1px solid #dde3ea; }
  .seg input:disabled + span { color:#b8bfc7; background:#f2f4f6; cursor:not-allowed; }
  .seg input:checked + span { background:var(--brand); color:var(--accent); }
  #cbyNote { font-size:12px; color:#6b7684; margin-top:5px; min-height:0; }
  #cbyNote b { color:#9a4a00; }
  #grad { margin-top:8px; }
  #grad .gbar { height:10px; border-radius:5px; background:linear-gradient(90deg, hsl(120 70% 40%), hsl(60 85% 45%), hsl(0 70% 48%)); }
  #grad.sur .gbar { background:linear-gradient(90deg, hsl(40 85% 46%), hsl(0 85% 46%)); }
  #grad .gnone { display:flex; align-items:center; gap:5px; font-size:12px; color:#445; margin-bottom:6px; }
  #grad .gnone[hidden], #grad .gbar[hidden] { display:none; }
  #grad .gl small { color:#7a8591; font-size:10.5px; }
  #gSteps { display:flex; gap:2px; }
  #gSteps[hidden] { display:none; }
  #gSteps .gs { flex:1; display:flex; flex-direction:column; align-items:center; font-size:12px; color:#445; min-width:0; }
  #gSteps .gs i { display:block; width:100%; height:12px; }
  #gSteps .gs:first-child i { border-radius:6px 0 0 6px; } #gSteps .gs:last-child i { border-radius:0 6px 6px 0; }
  #gSteps .gs b { margin-top:3px; font-variant-numeric:tabular-nums; }
  #gSteps .gs small { color:#7a8591; font-size:10.5px; }
  #grad .gl { display:flex; justify-content:space-between; font-size:12px; color:#445; margin-top:3px; font-variant-numeric:tabular-nums; }
  .key { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:#445; margin-top:8px; }
  .key span { display:inline-flex; align-items:center; gap:4px; }
  .key span[hidden] { display:none; }
  .key em { font-style:normal; }
  .key b { font-weight:600; color:#667; font-variant-numeric:tabular-nums; }
  #drawer label.small { display:flex; align-items:center; gap:6px; font-size:12px; color:#445; margin-top:6px; cursor:pointer; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; border:1.5px solid #fff; box-shadow:0 0 0 1px #0004; flex:none; }
  #meta { font-size:12px; color:#556; margin-top:6px; line-height:1.4; }
  #listinfo { font-size:12px; margin-top:6px; }
  #listinfo a { color:#0b62c4; cursor:pointer; }
  #status { top:calc(var(--bar) + 8px); left:50%; transform:translateX(-50%); max-width:360px; display:none; z-index:1004; }
  .pop h3 { margin:0 0 1px; font-size:14px; line-height:1.2; }
  .pop .head { display:flex; align-items:center; gap:10px; }
  .pop .head img { width:64px; height:32px; object-fit:contain; flex:none; }
  .pop .sub { color:#556; font-size:11.5px; margin-bottom:3px; }
  @font-face { font-family:"Seg7"; src:url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:"Seg14"; src:url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG14-Classic/DSEG14Classic-Bold.woff2") format("woff2"); font-display:swap; }
  /* forecourt price sign */
  .sign { background:#22272e; border-radius:7px; padding:4px; margin:5px 0 3px; box-shadow:inset 0 0 0 2px #3a414b; }
  .srow { display:grid; grid-template-columns:1fr 104px; gap:4px; }
  .srow + .srow { margin-top:4px; }
  .slabel { display:flex; flex-direction:column; justify-content:center; padding:2px 8px; border-radius:4px; color:#fff; min-width:0;
            font-weight:800; font-size:11.5px; letter-spacing:.4px; text-transform:uppercase; line-height:1.15; }
  .slabel .exv { font:600 10px/1.2 system-ui, sans-serif; letter-spacing:0; text-transform:none; opacity:.8; white-space:nowrap; }
  .lcd { position:relative; display:flex; align-items:center; justify-content:center; gap:2px; padding:4px 4px; border-radius:4px;
         background:linear-gradient(180deg,#ffe36b 0%,#f6c21c 55%,#eab308 100%); color:#141414;
         box-shadow:inset 0 0 6px rgba(0,0,0,.35); font:20px/1 "Seg7", ui-monospace, monospace; white-space:nowrap; }
  .lcd .dig { position:relative; }
  .lcd .ghost { position:absolute; left:0; top:0; color:#141414; opacity:.07; pointer-events:none; }
  .lcd .unit { font:700 10px/1 system-ui, sans-serif; align-self:flex-end; margin-bottom:1px; }
  .lcd.word { font-family:"Seg14", ui-monospace, monospace; font-size:15px; }
  /* collapsible panels in the popup */
  .pp { border:1px solid #e3e8ee; border-radius:6px; margin:5px 0 0; overflow:hidden; }
  .pp > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; padding:4px 8px; background:#f3f5f8; font-size:11px; font-weight:700; color:#445; text-transform:uppercase; letter-spacing:.3px; }
  .pp > summary::-webkit-details-marker { display:none; }
  .pp > summary::after { content:"▾"; margin-left:auto; font-size:12px; transition:transform .15s; }
  .pp[open] > summary::after { transform:rotate(180deg); }
  .pp > summary .ps { text-transform:none; letter-spacing:0; font-weight:600; color:#1e7a3c; }
  .pp > summary .ps.no { color:#9a6200; }
  .pp .pb { padding:4px 8px 6px; }
  .pp .cards { border:0; margin:0; border-radius:0; max-height:200px; overflow-y:auto; }
  /* popup never taller than this – scrolls instead (also when a panel is opened) */
  .leaflet-popup-content { max-height:min(480px, calc(100vh - 170px)); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; padding-right:2px; }
  @media (max-width:600px) { .leaflet-popup-content { max-height:min(380px, calc(100vh - 150px)); } }
  .pp .cards .ch { position:sticky; top:0; z-index:1; }
  .f-diesel  { background:#111; }
  .f-pdiesel { background:#111; color:#f2c94c; }
  .f-b10     { background:#3b3f45; }
  .f-hvo     { background:#1d5a4c; }
  .f-unl     { background:#00843d; }
  .f-sup     { background:#c8102e; }
  .f-adblue  { background:#0067b1; text-transform:none; font-size:14px; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; background:#eef1f4; margin:2px 2px 0 0; }
  .tag.g { background:#d9f2e2; } .tag.a { background:#fdeccc; } .tag.r { background:#f9dcd9; }
  .pop .links { margin-top:6px; font-size:13px; }
  .cards { border:1px solid #e3e8ee; border-radius:6px; margin:6px 0 4px; overflow:hidden; }
  .cards .ch { display:flex; font-size:11px; font-weight:700; color:#556; background:#f3f5f8; padding:3px 8px; text-transform:uppercase; letter-spacing:.3px; }
  .cards .ch span { margin-left:auto; }
  .crow { display:flex; align-items:center; gap:4px; padding:3px 8px; font-size:13px; border-top:1px solid #eef1f4; }
  .crow .cname { font-weight:600; display:flex; flex-direction:column; line-height:1.15; }
  .crow .cgrp { font-weight:400; font-size:10.5px; color:#7a8591; }
  .crow .csur { margin-left:auto; font-variant-numeric:tabular-nums; color:#1e7a3c; font-weight:600; }
  .crow.sel { background:#eef8f1; }
  .crow.no { background:#fff6e5; } .crow.no .csur { color:#9a6200; font-weight:500; }
  .crow .tag { margin:0; }
  .pop .links { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .pop .links a.nav { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:9px;
                      background:#1a73e8; color:#fff !important; box-shadow:0 1px 3px #0004; }
  .pop .links a.nav:hover { background:#1558b0; }
  .pop .links a.tel { color:#1d232b; text-decoration:none; font-variant-numeric:tabular-nums; }
  .crow .cimg { width:30px; height:19px; border-radius:3px; object-fit:cover; flex:none; margin-right:3px; box-shadow:0 0 0 1px #0002; }
  #drawer .lh .hint { text-transform:none; font-weight:500; color:#8a94a0; letter-spacing:0; }
  /* card provider: collapsible list, logos */
  #provBox { margin-top:12px; border:1px solid #e1e6ec; border-radius:8px; background:#fff; }
  #provBox[hidden] { display:none; }
  #provBox summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:7px 9px; font-size:12px; font-weight:700; color:#556; text-transform:uppercase; letter-spacing:.4px; }
  #provBox summary::-webkit-details-marker { display:none; }
  #provBox summary::after { content:"▾"; margin-left:auto; font-size:13px; transition:transform .15s; }
  #provBox[open] summary::after { transform:rotate(180deg); }
  #provBox summary .pcur { display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; color:#223; font-weight:600; font-size:13px; }
  #provBox summary .pcur img { height:20px; max-width:60px; object-fit:contain; }
  #provList { padding:0 8px 8px; display:grid; gap:5px; }
  .prov { display:flex; align-items:center; gap:10px; padding:6px 8px; border:2px solid #e1e6ec; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }
  .prov input { position:absolute; opacity:0; pointer-events:none; }
  .prov .pl { width:70px; height:34px; display:flex; align-items:center; justify-content:center; }
  .prov .pl img { max-width:70px; max-height:34px; }
  .prov small { display:block; font-weight:400; color:#7a8591; font-size:11px; }
  .prov.on { border-color:var(--brand); background:#fff8d6; }
  .cchips { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .cchips[hidden] { display:none; }
  .cchip { position:relative; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 4px 4px;
           border:2px solid #dde3ea; border-radius:8px; background:#fff; text-align:center; font-size:12px; line-height:1.15; }
  .cchip input { position:absolute; opacity:0; pointer-events:none; }
  .cchip img { width:72px; height:45px; object-fit:cover; border-radius:5px; box-shadow:0 1px 2px #0003; }
  .cchip .cn { font-weight:700; }
  .cchip .cc { color:#7a8591; font-size:11px; }
  .cchip.on { border-color:var(--brand); background:#fff8d6; }
  .cchip.on::after { content:"✓"; position:absolute; top:2px; right:5px; width:16px; height:16px; line-height:16px; text-align:center; border-radius:50%; font-size:11px; font-weight:800; color:var(--accent); background:var(--brand); }
  .cchip.off { opacity:.45; cursor:default; }
  /* my settings / vehicles / cost per mile */
  #mySettings { width:100%; margin-top:6px; font-weight:700; background:#fff; border:2px solid #000; }
  #mySettings:hover { background:#fff8d6; }
  #vehBox select { width:100%; padding:7px; border-radius:8px; border:1px solid #ccd; font:inherit; }
  #vehInfo { font-size:12px; color:#556; margin-top:4px; }
  #cardHint { font-size:12px; color:#6b7684; margin-top:5px; }
  .cchip .cp { font-size:10.5px; color:#000; background:#ffe058; border-radius:4px; padding:0 4px; font-weight:700; }
  .cpm { background:#000; color:#fff; border-radius:6px; padding:5px 8px; margin:4px 0; font-size:13px; }
  .cpm b { color:#ffe058; } .cpm small { color:#ccc; }
  .crow .cyp { font-weight:400; font-size:10.5px; color:#000; }
  .evk { display:flex; align-items:center; gap:5px; font-size:12px; color:#445; margin-top:6px; }
  .evpop h3 { margin:0 0 2px; font-size:15px; } .evpop .sub { color:#556; font-size:12px; }
  .evpop .spd { display:inline-block; background:#0f8f8a; color:#fff; border-radius:5px; padding:1px 6px; font-size:12px; font-weight:700; margin:5px 0; }
  #settings { position:fixed; inset:0; z-index:3000; background:#0007; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:20px 10px; }
  #settings[hidden] { display:none; }
  #settings .sbox { background:#fff; border-radius:12px; width:100%; max-width:640px; box-shadow:0 10px 40px #0006; overflow:hidden; }
  #settings .shead { display:flex; align-items:center; gap:10px; background:#000; color:#fff; border-bottom:3px solid #ffe058; padding:10px 14px; }
  #settings .shead b { font-size:16px; } #settings .shead small { color:#bbb; }

  #settings .stabs { display:flex; gap:6px; padding:10px 14px 0; }
  #settings .stabs button.on { background:#000; color:#ffe058; border-color:#000; }
  #settings .spane { padding:10px 14px 16px; font-size:14px; }
  #settings .note { font-size:12.5px; color:#5a6572; margin:4px 0 10px; }
  .setrow { border:1px solid #e1e6ec; border-radius:10px; padding:8px 10px; margin:8px 0; }
  .setrow .top { display:flex; align-items:center; gap:10px; }
  .setrow .top img { width:56px; height:35px; object-fit:cover; border-radius:4px; box-shadow:0 1px 2px #0003; }
  .setrow .top .nm { display:flex; flex-direction:column; line-height:1.2; }
  .setrow .top .nm small { color:#6b7684; font-size:12px; } .setrow .top .nm small.exp { color:#b42318; }
  .setrow .top label { margin-left:auto; font-size:12.5px; display:flex; align-items:center; gap:4px; white-space:nowrap; }

  .setrow .lnk, .vrow .lnk { background:none; border:0; color:#000; text-decoration:underline; text-decoration-color:#e0b800; text-decoration-thickness:2px; padding:4px 2px; font-size:13px; }
  .setrow textarea { width:100%; box-sizing:border-box; margin-top:6px; font:inherit; font-size:13px; padding:6px; border:1px solid #c5ccd5; border-radius:7px; }
  .setrow .pres { font-size:12.5px; margin-left:6px; }

    #brand img { max-height:30px; max-width:96px; }
    #search { font-size:16px; padding:6px 8px; }

    .lcd.word { font-size:13px; }
    .tag { font-size:10px; padding:1px 5px; }
    .pop .links { font-size:12px; margin-top:4px; }
  }
</style>
</head>
<body>
<header id="bar">
  <button id="menuBtn" title="Menu" aria-label="Menu">☰<span class="nf" id="nFilters" hidden></span></button>
  <div id="brand"><img id="brandLogo" src="brand/logo.png" alt="Atlantis Transport Services Ltd"></div>
  <input id="search" type="search" placeholder="Find town, postcode or station…" autocomplete="off">
  <button id="locate" title="Show my location">📍</button>
</header>
<div id="map"></div>
<div id="settings" hidden><div class="sbox">
  <div class="shead"><b>My settings</b><small>Saved on this device only</small><button id="closeSettings" aria-label="Close">✕</button></div>
  <div class="stabs"><button data-st="prices" class="on">Fuel card prices</button><button data-st="veh">My vehicles</button></div>
  <div class="spane" id="stPrices"></div>
  <div class="spane" id="stVeh" hidden></div>
</div></div>
<div id="status" class="panel"></div>

<aside id="drawer">
  <div class="dhead">Filters<button id="closeMenu" aria-label="Close">✕</button></div>
  <button id="mySettings">⚙ My settings – card prices &amp; vehicles</button>
  <div class="lh">Fuel <span class="hint">– stations with any ticked</span></div>
  <div class="chips">
    <label class="chip c-diesel"><input type="checkbox" data-fuel="diesel"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h9a1 1 0 0 1 1 1v16h1v2H3v-2h1V4a1 1 0 0 1 1-1zm2 2v5h6V5zm9.3 1.3 1.4-1.4 3 3a1 1 0 0 1 .3.7V17a2.5 2.5 0 0 1-5 0v-3h-1v-2h2a1 1 0 0 1 1 1v4a.5.5 0 0 0 1 0v-5.6a2.5 2.5 0 0 1-1-2V7.7z"/></svg>Diesel</span></label>
    <label class="chip c-unl"><input type="checkbox" data-fuel="unleaded"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h9a1 1 0 0 1 1 1v16h1v2H3v-2h1V4a1 1 0 0 1 1-1zm2 2v5h6V5zm9.3 1.3 1.4-1.4 3 3a1 1 0 0 1 .3.7V17a2.5 2.5 0 0 1-5 0v-3h-1v-2h2a1 1 0 0 1 1 1v4a.5.5 0 0 0 1 0v-5.6a2.5 2.5 0 0 1-1-2V7.7z"/></svg>Unleaded</span></label>
    <label class="chip c-adblue"><input type="checkbox" data-fuel="adblue"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>AdBlue</span></label>
    <label class="chip c-ev"><input type="checkbox" data-fuel="electric"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>Electric</span></label>
  </div>
  <div id="vehBox" hidden><div class="lh">My vehicle</div><select id="vehSel"></select><div id="vehInfo"></div></div>
  <div class="lh">Colour pumps by</div>

    <label><input type="radio" name="cby" value="price" checked><span>Pump price</span></label>

  <div id="cbyNote"></div>
  <div id="grad" hidden><div class="gnone" hidden><i class="dot" style="background:var(--green)"></i><span id="gNone"></span></div><div class="gbar"></div><div id="gSteps" hidden></div><div class="gl"><span id="gMin"></span><span id="gMax"></span></div></div>
  <details id="provBox" hidden><summary>Card provider <span class="pcur" id="provCur"></span></summary><div id="provList"></div></details>
  <div class="lh" id="cardsHead">Fuel cards <span class="hint">– stations taking any ticked</span></div>

  <div id="cardHint"></div>
  <div id="cardOpts" hidden>
    <label class="small"><input type="checkbox" id="showOthers"> Also show stations that don't take them</label>
    <label class="small"><input type="checkbox" id="hideNoHgv"> Hide sites marked “no HGVs”</label>
  </div>
  <div class="lh">Key</div>
  <div class="key" style="margin-top:0" id="key">
    <span id="k-green"><i class="dot" style="background:var(--green)"></i><em id="kl-green">Takes card</em> <b id="c-green"></b></span>
    <span id="k-amber"><i class="dot" style="background:var(--amber)"></i><em id="kl-amber">Fuel station</em> <b id="c-amber"></b></span>
    <span id="k-red"><i class="dot" style="background:var(--red)"></i><em id="kl-red">No HGVs</em> <b id="c-red"></b></span>
  </div>
  <div class="evk" id="xKey" hidden><i class="dot" style="background:#6d4fd8"></i><em>Truck stop / depot – card site, not in Fuel Finder (no pump prices)</em> <b id="c-x"></b></div>
  <div class="evk" id="evKey" hidden><i class="dot" style="background:#0f8f8a"></i><em>EV charge point</em> <b id="c-ev"></b></div>
  <label class="small"><input type="checkbox" id="showClosed"> Show temporarily closed (<span id="c-grey"></span>)</label>
  <div id="listinfo"></div>
  <div id="meta">Loading…</div>
</aside>
<div id="scrim"></div>

<div id="unmatched" class="panel"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="convert.js"></script>
<script>
(function () {
  "use strict";
  const COLORS = { green:"#1e9e4a", amber:"#f0a020", red:"#d63a2f", grey:"#8a8f98", extra:"#6d4fd8" };   // extra = card site not in Fuel Finder
  const UK_BOUNDS = L.latLngBounds([49.6, -9.2], [61.1, 2.4]);
  const FUEL_NAMES = {
    B7_STANDARD:"Diesel", B7S:"Diesel", B7:"Diesel", B7_PREMIUM:"Premium diesel", B7P:"Premium diesel",
    B10:"Diesel B10", HVO:"HVO", E10:"Unleaded", E5:"Super unleaded"
  };
  const FUEL_CLASS = {
    B7_STANDARD:"f-diesel", B7S:"f-diesel", B7:"f-diesel", B7_PREMIUM:"f-pdiesel", B7P:"f-pdiesel",
    B10:"f-b10", HVO:"f-hvo", E10:"f-unl", E5:"f-sup"
  };
  const FUEL_ORDER = ["B7_STANDARD","B7S","B7","B7_PREMIUM","B7P","HVO","B10","E10","E5"];
  const AMENITY_NAMES = {
    adblue_pumps:"AdBlue pumps", adblue_packaged:"AdBlue (cans)", lpg_pumps:"LPG", car_wash:"Car wash",
    customer_toilets:"Toilets", water_filling:"Water", air_pump_or_screenwash:"Air/screenwash", twenty_four_hour_fuel:"24h fuel"
  };
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const SMALL = window.matchMedia("(max-width:600px)").matches;
  
  const map = L.map("map", {
    preferCanvas: true, maxBounds: UK_BOUNDS, maxBoundsViscosity: 0.9, minZoom: 5, zoomSnap: 0.5, zoomControl: false
  }).fitBounds([[49.9, -8.2], [60.9, 1.8]]);
  L.control.zoom({ position: "topleft" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Prices: GOV.UK Fuel Finder (OGL v3.0)'
  }).addTo(map);

  const canvas = L.canvas({ padding: 0.3, tolerance: L.Browser.mobile ? 14 : 8 });
  const layer = L.layerGroup().addTo(map);
  let stations = [], markers = [], meta = {}, logos = {};
  let cards = [];          // [{id, name, img, rows:[...]}] from cards/index.json + cards/<id>.csv
  let selCards = new Set();
  // card providers (Admin → Card providers): surcharges depend on who supplies the card
  let providers = [], selProvider = "";   // [{id, name, logo, surRows:{cardId:[rows]}}]
  const curProvider = () => providers.find(p => p.id === selProvider) || null;
  // "Other" is built in: no surcharges, and the default until someone picks their provider
  const OTHER = { id: "other", name: "Other", logo: "", surRows: {}, builtin: true };
  const OTHER_ICON = '<svg viewBox="0 0 48 30" width="48" height="30" aria-hidden="true"><rect x="1" y="1" width="46" height="28" rx="4" fill="#fff" stroke="#9aa3ad" stroke-width="2"/><rect x="1" y="7" width="46" height="5" fill="#9aa3ad"/><rect x="6" y="18" width="16" height="3" rx="1.5" fill="#c5ccd5"/></svg>';
  function useProvider() {   // put the chosen provider's surcharges on the cards, then re-match
    const p = curProvider();
    for (const c of cards) c.surRows = (p && p.surRows[c.id]) || [];
  }
  function renderProviders() {
    $("provBox").hidden = !providers.length;
    const p = curProvider();
    $("provCur").innerHTML = p ? (p.logo ? `<img src="providers/${esc(p.logo)}" alt="">` : "") + esc(p.name) : "None";
    $("provList").innerHTML = providers.map(q => {
      const n = Object.keys(q.surRows).filter(id => q.surRows[id].length).map(id => (cards.find(c => c.id === id) || { name: id }).name);
      return `<label class="prov${q.id === selProvider ? " on" : ""}"><input type="radio" name="prov" value="${esc(q.id)}"${q.id === selProvider ? " checked" : ""}>
        <span class="pl">${q.logo ? `<img src="providers/${esc(q.logo)}" alt="">` : q.builtin ? OTHER_ICON : ""}</span>
        <span>${esc(q.name)}<small>${q.builtin ? "No surcharges" : n.length ? "Surcharges: " + esc(n.join(", ")) : "No surcharge lists yet"}</small></span></label>`;
    }).join("");
  }
  const cardImg = c => c.img ? "cards/" + c.img : FuelMap.dummyCardImg(c.name);

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const normPc = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const title = s => String(s || "").toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase());
  function status(msg, ms) {
    const el = $("status"); el.innerHTML = msg; el.style.display = msg ? "block" : "none";
    if (ms) setTimeout(() => { if (el.innerHTML === msg) el.style.display = "none"; }, ms);
  }

  // ---------- fuel card lists (parsing lives in convert.js) ----------
  function matchCards() {
    stations = stations.filter(s => !s.extra);   // Fuel Finder stations only; card-only sites are rebuilt below
    for (const s of stations) s.cards = {};
    for (const card of cards) {
      const byPc = new Map(), byId = new Map();
      card.rows.forEach(r => {
        r.matched = 0;
        if (r.extra) return;
        if (r.id) byId.set(r.id, r);
        if (r.pc) { if (!byPc.has(r.pc)) byPc.set(r.pc, []); byPc.get(r.pc).push(r); }
      });
      for (const s of stations) {
        let hit = byId.get(s.id) || null;
        if (!hit) {
          const cands = byPc.get(normPc(s.pc));
          // several list rows on one postcode: pick the one whose name best matches
          if (cands && cands.length) hit = cands.length === 1 ? cands[0] : cands.slice().sort((a, b) => nameScore(b.name, s) - nameScore(a.name, s))[0];
        }
        if (hit) { hit.matched++; s.cards[card.id] = hit; }
      }
      card.unmatched = card.rows.filter(r => !r.matched && !r.extra);
      applySurcharges(card, byPcStations());
    }
    // sites a card takes that aren't in Fuel Finder (truck stops, depots): shown only while one of their cards is ticked
    const extras = [], xGrid = new Map(), xKey = (y, x) => Math.round(y * 400) + "," + Math.round(x * 250);
    for (const card of cards) for (const r of card.rows) {
      if (!r.extra) continue;
      let s = null;
      const ky = Math.round(r.lat * 400), kx = Math.round(r.lng * 250);
      for (let a = -1; a <= 1 && !s; a++) for (let b = -1; b <= 1 && !s; b++) s = (xGrid.get((ky + a) + "," + (kx + b)) || []).find(e => Math.abs(e.y - r.lat) < 0.0005 && Math.abs(e.x - r.lng) < 0.0008) || null;
      if (!s) {
        s = { id: "x:" + (r.src || r.lat + "," + r.lng), extra: 1, n: r.srcName || r.name, b: r.brand || "", a: r.addr || "", c: r.town || "", pc: r.srcPc || "",
              y: r.lat, x: r.lng, p: {}, ho: r.hours || "", cards: {} };
        extras.push(s); const k = xKey(r.lat, r.lng); if (!xGrid.has(k)) xGrid.set(k, []); xGrid.get(k).push(s);
      }
      s.cards[card.id] = r;
    }
    stations = stations.concat(extras);
    renderCardChips();
  }
  function renderCardChips() {
    const withList = visibleCards(), cp = cardPrices();
    for (const id of [...selCards]) if (!withList.some(c => c.id === id)) selCards.delete(id);
    $("cardsHead").hidden = !cards.some(hasList); $("cardChips").hidden = !withList.length;
    $("cardHint").innerHTML = !cards.some(hasList) ? "" : withList.length ? "Showing the cards you've priced – change in ⚙ My settings."
      : "No cards yet – enter this week's price for your cards in <b>⚙ My settings</b> and they'll show here.";
    $("cardChips").innerHTML = withList.map(c => {
      const n = stations.filter(s => s.cards && s.cards[c.id]).length, has = c.rows.length > 0 || (c.surRows || []).length > 0;
      return `<label class="cchip${selCards.has(c.id) ? " on" : ""}${has ? "" : " off"}" title="${esc(c.name)}">
        <input type="checkbox" data-card="${esc(c.id)}"${selCards.has(c.id) ? " checked" : ""}${has ? "" : " disabled"}>
        <img src="${esc(cardImg(c))}" alt=""><span class="cn">${esc(c.name)}</span>
        <span class="cc">${has ? n.toLocaleString() + " sites" : "no list yet"}</span>${cp[c.id] ? `<span class="cp">${cp[c.id].p.toFixed(2)}p ex VAT</span>` : ""}</label>`;
    }).join("");
  }
  $("cardChips").addEventListener("change", e => {
    const id = e.target.dataset.card; if (!id) return;
    if (e.target.checked) selCards.add(id); else selCards.delete(id);
    e.target.closest(".cchip").classList.toggle("on", e.target.checked);
    draw();
  });
  $("provList").addEventListener("change", e => {
    if (e.target.name !== "prov") return;
    selProvider = e.target.value; useProvider(); matchCards(); renderProviders(); draw();
  });
  $("provBox").addEventListener("toggle", () => { try { localStorage.setItem("fuelmap-prov-open", $("provBox").open ? "1" : "0"); } catch (e) {} });
  // postcode → stations index (built once)
  let _pcIdx = null;
  function byPcStations() {
    if (_pcIdx) return _pcIdx;
    _pcIdx = { pc: new Map(), out: new Map(), id: new Map() };
    for (const s of stations) {
      const pc = normPc(s.pc), out = pc.slice(0, -3);
      if (!_pcIdx.pc.has(pc)) _pcIdx.pc.set(pc, []); _pcIdx.pc.get(pc).push(s);
      if (!_pcIdx.out.has(out)) _pcIdx.out.set(out, []); _pcIdx.out.get(out).push(s);
      _pcIdx.id.set(s.id, s);
    }
    return _pcIdx;
  }
  // Surcharge layer: kept apart from the card's site list, so removing it puts everything back.
  // A site on the surcharge list also counts as taking the card.
  function applySurcharges(card, idx) {
    card.surUnmatched = [];
    for (const r of card.surRows || []) {
      let s = r.id && idx.id.get(r.id);
      const pc = FuelMap.cleanPc(r.pcRaw);
      if (!s) {
        const c = idx.pc.get(pc) || idx.pc.get(r.pcRaw);
        if (c) s = c.length === 1 ? c[0] : c.slice().sort((a, b) => nameScore(r.name, b) - nameScore(r.name, a))[0];
        else if (r.name) {   // postcode not found: same postcode area + a clear name match
          const cand = (idx.out.get(pc.slice(0, -3)) || []).map(x => [x, nameScore(r.name, x)]).filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]);
          if (cand.length && (cand.length === 1 || cand[0][1] > cand[1][1])) s = cand[0][0];
        }
      }
      if (!s) { card.surUnmatched.push(r); continue; }
      const hit = s.cards[card.id] || (s.cards[card.id] = { hgv: null, fromSur: true });
      hit.sur = (+r.ppl.toFixed(2)) + "p"; hit.group = r.group;
    }
    // with a surcharge list, any other site taking the card has no surcharge
    if ((card.surRows || []).length) for (const s of stations) { const h = s.cards[card.id]; if (h && !h.sur) h.noSur = true; }
  }
  const hasList = c => c.rows.length > 0 || (c.surRows || []).length > 0;
  const chosenCards = () => visibleCards().filter(c => selCards.has(c.id));
  function catFor(s, sel) {
    if (s.tc) return "grey";
    if (!sel.length) return "amber";
    const hits = sel.filter(c => s.cards[c.id]);
    if (!hits.length) return "red";                                                    // doesn't take a ticked card
    return hits.every(c => s.cards[c.id].hgv === false) ? "amber" : "green";           // amber = card site, no HGVs
  }
  function updateKey(sel) {
    const any = sel.length > 0, nm = sel.length === 1 ? sel[0].name : "a ticked card";
    $("k-green").hidden = !any;
    $("k-red").hidden = !any || !$("showOthers").checked;
    $("kl-amber").textContent = any ? (sel.length === 1 ? sel[0].name : "Card") + " site – no HGVs" : "Fuel station";
    if (any) { $("kl-green").textContent = "Takes " + nm; $("kl-red").textContent = "Doesn't take " + nm; }
    $("cardOpts").hidden = !any;
    $("listinfo").innerHTML = !cards.some(hasList) ? "No fuel card lists published yet" :
      sel.map(c => `${esc(c.name)}: <b>${c.rows.length}</b> sites` +
        (c.unmatched.length ? ` · <a data-un="${esc(c.id)}">${c.unmatched.length} not matched</a>` : "") +
        ((c.surRows || []).length ? `<br>${esc(c.name)} surcharges: <b>${c.surRows.length - c.surUnmatched.length}</b> applied` +
          (c.surUnmatched.length ? ` · <a data-unsur="${esc(c.id)}">${c.surUnmatched.length} not matched</a>` : "") : "")).join("<br>");
    $("listinfo").querySelectorAll("[data-un]").forEach(a => a.onclick = () => showUnmatched(cards.find(c => c.id === a.dataset.un)));
    $("listinfo").querySelectorAll("[data-unsur]").forEach(a => a.onclick = () => showUnmatched(cards.find(c => c.id === a.dataset.unsur), true));
  }
  function nameScore(name, s) {
    const a = new Set(String(name).toLowerCase().split(/\W+/).filter(w => w.length > 2));
    const b = (s.n + " " + s.b + " " + s.a).toLowerCase();
    let n = 0; a.forEach(w => { if (b.includes(w)) n++; }); return n;
  }
  function showUnmatched(card, sur) {
    const rows = sur ? card.surUnmatched : card.unmatched, el = $("unmatched");
    el.innerHTML = `<b>${esc(card.name)} ${sur ? "surcharge list rows" : "sites"} that didn't match a Fuel Finder station</b>
      <p style="font-size:13px;margin:6px 0">Usually a postcode that differs slightly. Fix the postcode in your list, or add a <code>node_id</code> column with the station's ID (shown at the bottom of each station's popup).</p>
      <ul>${rows.map(r => `<li>${esc(r.name || "(no name)")} – ${esc(r.raw.join(", "))}</li>`).join("")}</ul>
      <button id="closeUn">Close</button>`;
    el.style.display = "block"; $("closeUn").onclick = () => el.style.display = "none";
  }

  const exVat = p => (p / 1.2).toFixed(1) + "p";   // pump prices include 20% VAT

  // ---------- colour by: pump price (default) / card surcharge ----------
  // cbyPref = what the user picked; the mode actually used falls back when that isn't possible
  let cbyPref = "price";
  const PRICE_KEYS = { diesel: ["B7S", "B7_STANDARD", "B7"], unleaded: ["E10"] };   // standard grades only
  function priceOf(s, fuel) { for (const k of PRICE_KEYS[fuel] || []) if (s.p && s.p[k] != null) return s.p[k]; return null; }
  function surOf(s, card) {
    const r = card && s.cards[card.id]; if (!r) return null;
    if (!String(r.sur || "").trim()) return 0;   // nothing listed = no surcharge
    let v = parseFloat(String(r.sur).replace(/[^0-9.\-]/g, "")); if (!isFinite(v)) return null;
    if (/£/.test(r.sur) && v < 1) v *= 100;   // £0.02 → 2p
    return v;
  }
  const gradCol = t => `hsl(${Math.round(120 * (1 - t))} ${t > .35 && t < .65 ? 85 : 72}% ${t > .35 && t < .65 ? 44 : 41}%)`;
  let gradInfo = null;   // {mode, fuel|card} while a gradient is showing
  function recolour() {
    if (!gradInfo) return;
    const b = map.getBounds().pad(0.05), vals = [];
    for (const m of markers) {
      if (!b.contains(m.getLatLng())) { m._v = undefined; continue; }
      m._v = gradInfo.mode === "price" ? priceOf(m.s, gradInfo.fuel) : surOf(m.s, gradInfo.card);
      if (m._v != null) vals.push(m._v);
    }
    // surcharge: none = green, then amber → red for the rest; price: green → red
    const sur = gradInfo.mode === "sur", ranked = sur ? vals.filter(v => v > 0) : vals;
    const lo = Math.min(...ranked), hi = Math.max(...ranked);
    // colour by rank, so one very dear (or cheap) site doesn't squash everyone else into one colour
    const sorted = ranked.slice().sort((a, b) => a - b), rank = new Map();
    sorted.forEach((v, i) => { if (!rank.has(v)) rank.set(v, i); });
    const n = sorted.length, tOf = v => n > 1 && hi > lo ? rank.get(v) / (n - 1) : (sur ? 0 : 0);
    for (const m of markers) {
      if (m._v === undefined) continue;
      const c = m.s.extra ? COLORS.extra : m._v == null ? COLORS.grey
              : sur ? (m._v <= 0 ? COLORS.green : `hsl(${Math.round(40 * (1 - tOf(m._v)))} 85% 46%)`)
              : gradCol(tOf(m._v));
      if (m.options.fillColor !== c) m.setStyle({ fillColor: c });
    }
    const fmt = v => v.toFixed(1) + "p";
    $("grad").classList.toggle("sur", sur);
    $("grad").hidden = !vals.length;
    if (sur) {
      // stepped bar: one block per surcharge value, in the same colour as the pumps, with the value and site count
      const counts = new Map(); vals.forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
      const steps = [...counts.keys()].sort((a, b) => a - b);
      $("gSteps").innerHTML = steps.map(v => {
        const c = v <= 0 ? COLORS.green : `hsl(${Math.round(40 * (1 - tOf(v)))} 85% 46%)`;
        return `<div class="gs"><i style="background:${c}"></i><b>${v <= 0 ? "None" : (+v.toFixed(2)) + "p"}</b><small>${counts.get(v)} site${counts.get(v) > 1 ? "s" : ""}</small></div>`;
      }).join("");
      $("gSteps").hidden = false; $("gNone").parentNode.hidden = true; $("grad").querySelector(".gbar").hidden = true;
      $("gMin").textContent = ""; $("gMax").textContent = "";
    } else {
      $("gSteps").hidden = true;
      $("gNone").parentNode.hidden = true; $("grad").querySelector(".gbar").hidden = false;

    return `<div class="evpop"><h3>${esc(p.n || "EV charge point")}</h3><div class="sub">${esc(p.o || "")}${p.a ? " · " + esc(p.a) : ""}</div>
      ${p.s ? `<span class="spd">⚡ ${EV_SPEED[p.s]}</span>` : ""} <span class="sub">${p.k ? p.k + " connector" + (p.k > 1 ? "s" : "") : ""}${p.t ? " · " + esc(p.t) : ""}</span>
      <div class="links" style="display:flex;margin-top:8px"><a class="nav" href="${navUrl({ y: p.y, x: p.x, n: p.n })}" target="_blank" rel="noopener" title="Directions" aria-label="Directions">${NAV_ICON}</a></div>
      <div class="sub" style="font-size:10px;margin-top:4px">Source: Radius e-route</div></div>`;
  }
  function drawEv(on) {
    evLayer.clearLayers(); $("evKey").hidden = !on;
    if (!on) return;
    if (!evPoints) { loadEv(); $("c-ev").textContent = "loading…"; return; }
    const r = Math.max(4, radiusFor(map.getZoom()) * 0.62);
    for (const p of evPoints) L.circleMarker([p.y, p.x], { renderer: canvas, radius: r, color: "#fff", weight: 1.5, fillColor: EV_COL, fillOpacity: 1 })
      .bindPopup(() => evPopup(p), { maxWidth: 280 }).addTo(evLayer);
    $("c-ev").textContent = evPoints.length.toLocaleString();
  }

  // ---------- My settings (this device only): weekly card prices, hidden cards, vehicles ----------
  const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const addDays = (ymd, n) => { const t = new Date(ymd + "T12:00:00"); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
  const niceDate = ymd => new Date(ymd + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  // card prices are pence per litre EX VAT; each has an expiry date and is removed once it has passed
  function cardPrices() {
    const cp = Object.assign({}, prefs.cardPrices || {}), t = todayStr(); let gone = false;
    for (const k of Object.keys(cp)) if (!cp[k] || !(cp[k].p > 0) || !cp[k].until || cp[k].until < t) { delete cp[k]; gone = true; }
    if (gone) savePrefs({ cardPrices: cp });
    return cp;
  }
  const hiddenCards = () => new Set(prefs.hiddenCards || []);
  function visibleCards() {   // cards in the filter: only ones with a current price, and not hidden
    const cp = cardPrices(), hid = hiddenCards();
    return cards.filter(c => hasList(c) && !hid.has(c.id) && cp[c.id]);
  }
  // vehicles
  const VTYPES = ["Car", "Van", "Rigid HGV", "Artic HGV", "Bus / coach", "Other"], VFUELS = ["Diesel", "Petrol", "Hybrid", "Electric"];
  function estMpg(v) {   // rough, by weight first, then engine size; the user can type their own figure
    if (v.fuel === "Electric") return 0;
    const g = +v.gvw || 0, L_ = (+v.cc || 0) / 1000;
    let m;
    if (g >= 40000) m = 8.5; else if (g >= 32000) m = 9; else if (g >= 26000) m = 10; else if (g >= 18000) m = 11.5;
    else if (g >= 12000) m = 13.5; else if (g >= 7500) m = 16; else if (g > 3500) m = 20;
    else if (!g && v.type === "Artic HGV") m = 8.5; else if (!g && v.type === "Rigid HGV") m = 12; else if (!g && v.type === "Bus / coach") m = 9;
    else if (v.type === "Van" || g > 2600) m = v.fuel === "Petrol" ? 27 : 36 - Math.max(0, (L_ || 2) - 2) * 4;
    else m = v.fuel === "Petrol" ? 48 - Math.max(0, (L_ || 1.4) - 1.2) * 7 : 58 - Math.max(0, (L_ || 1.6) - 1.5) * 7;
    if (v.fuel === "Hybrid") m *= 1.3;
    return Math.max(5, Math.round(m * 10) / 10);
  }
  const vehMpg = v => +v.mpg > 0 ? +v.mpg : estMpg(v);
  const vehicles = () => prefs.vehicles || [];
  const curVehicle = () => vehicles().find(v => v.id === prefs.vehicle) || null;
  const vehFuelKey = v => !v ? null : v.fuel === "Diesel" ? "diesel" : v.fuel === "Petrol" || v.fuel === "Hybrid" ? "unleaded" : v.fuel === "Electric" ? "electric" : null;
  const ppm = (pence, mpg) => pence * 4.54609 / mpg;   // pence per litre → pence per mile
  function pumpCostLine(s) {
    const v = curVehicle(); if (!v) return "";
    const fk = vehFuelKey(v), mpg = vehMpg(v), p = fk === "diesel" || fk === "unleaded" ? priceOf(s, fk) : null;
    if (!mpg || p == null) return "";
    return `<div class="cpm"><b>${esc(v.reg)}</b> ≈ <b>${ppm(p, mpg).toFixed(1)}p/mile</b> at the pump <small>(${ppm(p / 1.2, mpg).toFixed(1)}p ex VAT · ${mpg} mpg${+v.mpg > 0 ? "" : " est."})</small></div>`;
  }
  function cardPriceLine(c, r) {
    const cp = cardPrices()[c.id]; if (!cp) return "";
    const sur = parseFloat(String(r.sur || "").replace(/[^0-9.]/g, "")) || 0, tot = cp.p + sur, v = curVehicle(), mpg = v ? vehMpg(v) : 0;
    return `<small class="cyp">Your price ${cp.p.toFixed(2)}p${sur ? " + " + sur.toFixed(2) + "p" : ""} ex VAT${mpg && vehFuelKey(v) !== "electric" ? ` ≈ <b>${ppm(tot, mpg).toFixed(1)}p/mile</b>` : ""}</small>`;
  }
  function renderVehSel() {
    const vs = vehicles(), v = curVehicle();
    $("vehBox").hidden = !vs.length;
    $("vehSel").innerHTML = '<option value="">No vehicle</option>' + vs.map(x => `<option value="${esc(x.id)}"${v && x.id === v.id ? " selected" : ""}>${esc(x.reg)}${x.name ? " – " + esc(x.name) : x.make ? " – " + esc(x.make + " " + (x.model || "")) : ""}</option>`).join("");
    $("vehInfo").innerHTML = !v ? "Pick one to see the cost per mile at each station." : vehMpg(v) ? `≈ <b>${vehMpg(v)}</b> mpg${+v.mpg > 0 ? "" : " (estimate)"} – cost per mile shows in each station.` : "Electric – showing charge points.";
  }
  $("vehSel").addEventListener("change", () => {
    savePrefs({ vehicle: $("vehSel").value });
    const fk = vehFuelKey(curVehicle());
    if (fk) document.querySelectorAll("[data-fuel]").forEach(c => c.checked = c.dataset.fuel === fk);   // show the fuel this vehicle uses
    renderVehSel(); draw();
  });
  // paste a price email / text message: find the diesel price (pence per litre, or £ per litre), and a "valid until" date if there is one
  function parsePrice(text) {
    const t = String(text).replace(/\s+/g, " ");
    const inc = /\binc(?:l(?:uding|\.)?)?\s*vat\b/i.test(t) && !/\bex(?:cl(?:uding|\.)?)?\s*vat\b/i.test(t);
    const re = /(£\s*)?(\d{1,3}(?:\.\d{1,4})?)\s*(ppl\b|p\/l\b|p per l(?:itre)?\b|pence\b|p\b)?/gi, cands = [];
    let m;
    while ((m = re.exec(t))) {
      let v = parseFloat(m[2]); if (!isFinite(v)) continue;
      if (m[1] || (v > 0.5 && v < 3 && m[2].includes("."))) v *= 100;
      if (v < 50 || v > 400) continue;
      const ctx = t.slice(Math.max(0, m.index - 45), m.index + 45).toLowerCase();
      let sc = 0; if (/diesel|derv|\bdery\b/.test(ctx)) sc += 3; if (m[3]) sc += 2; if (m[1]) sc += 1; if (/adblue|petrol|unleaded|e10|super/.test(ctx)) sc -= 2;
      cands.push({ v, sc });
    }
    if (!cands.length) return null;
    cands.sort((a, b) => b.sc - a.sc);
    let p = cands[0].v; if (inc) p /= 1.2;
    let until = null;
    const dm = t.match(/(?:until|till|to|expires?|valid (?:to|until)|ending|-)\s*(?:\w+day\s*)?(\d{1,2})(?:st|nd|rd|th)?[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/i);
    if (dm) { const y = dm[3] ? (dm[3].length === 2 ? "20" + dm[3] : dm[3]) : String(new Date().getFullYear()); const d = `${y}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`; if (!isNaN(new Date(d))) until = d; }
    return { p: Math.round(p * 100) / 100, inc, until };
  }
  let stTab = "prices", vEdit = null;
  function openSettings(tab) { if (tab) stTab = tab; $("settings").hidden = false; renderSettings(); }
  function renderSettings() {
    document.querySelectorAll("#settings .stabs button").forEach(b => b.classList.toggle("on", b.dataset.st === stTab));
    $("stPrices").hidden = stTab !== "prices"; $("stVeh").hidden = stTab !== "veh";
    if (stTab === "prices") renderPricesTab(); else renderVehTab();
  }
  function renderPricesTab() {
    const cp = cardPrices(), hid = hiddenCards(), list = cards.filter(hasList), t = todayStr();
    $("stPrices").innerHTML = `<p class="note">Type this week's price for each card you use (<b>pence per litre, ex VAT</b>), or paste the email / text your provider sends.
      Each price has an expiry date – when it passes, the price is removed so you always enter the latest one. A card only shows in the filter while it has a current price. Untick <b>Show</b> to hide a card even when it's priced.</p>` +
      list.map(c => {
        const pr = cp[c.id], soon = pr && pr.until <= addDays(t, 1);
        return `<div class="setrow" data-cid="${esc(c.id)}"><div class="top"><img src="${esc(cardImg(c))}" alt=""><div class="nm"><b>${esc(c.name)}</b>
          <small class="${soon ? "exp" : ""}">${pr ? `Your price ${pr.p.toFixed(2)}p ex VAT · ${soon ? "expires" : "until"} ${niceDate(pr.until)}` : "No price"}</small></div>
          <label><input type="checkbox" data-show${hid.has(c.id) ? "" : " checked"}> Show</label></div>
          <div class="pin"><input type="number" step="0.01" min="0" inputmode="decimal" data-price placeholder="e.g. 128.50" value="${pr ? pr.p : ""}"> p/litre ex VAT · valid until
            <input type="date" data-until min="${t}" value="${pr ? pr.until : addDays(t, 7)}">${pr ? ' <button class="lnk" data-clear>Clear</button>' : ""}</div>
          <button class="lnk" data-paste>Paste price email / text</button>
          <div data-pastebox hidden><textarea rows="3" placeholder="Paste the message from your card provider here"></textarea>
            <button data-parse>Find the price</button><span class="pres"></span></div></div>`;
      }).join("");
  }
  function setCardPrice(cid, p, until) {
    const cp = cardPrices();
    if (p > 0) cp[cid] = { p: Math.round(p * 100) / 100, from: todayStr(), until: until && until >= todayStr() ? until : addDays(todayStr(), 7) };
    else delete cp[cid];
    savePrefs({ cardPrices: cp }); renderCardChips(); draw(); renderPricesTab();
  }
  $("stPrices").addEventListener("change", e => {
    const row = e.target.closest("[data-cid]"); if (!row) return; const cid = row.dataset.cid;
    if (e.target.matches("[data-show]")) { const h = hiddenCards(); e.target.checked ? h.delete(cid) : h.add(cid); savePrefs({ hiddenCards: [...h] }); renderCardChips(); draw(); return; }
    if (e.target.matches("[data-price],[data-until]")) setCardPrice(cid, parseFloat(row.querySelector("[data-price]").value), row.querySelector("[data-until]").value);
  });
  $("stPrices").addEventListener("click", e => {
    const row = e.target.closest("[data-cid]"); if (!row) return; const cid = row.dataset.cid;
    if (e.target.matches("[data-clear]")) setCardPrice(cid, 0);
    if (e.target.matches("[data-paste]")) { const b = row.querySelector("[data-pastebox]"); b.hidden = !b.hidden; if (!b.hidden) b.querySelector("textarea").focus(); }
    if (e.target.matches("[data-parse]")) {
      const r = parsePrice(row.querySelector("textarea").value), out = row.querySelector(".pres");
      if (!r) { out.innerHTML = '<span style="color:#b42318">Couldn\'t find a price – type it in the box above.</span>'; return; }
      row.querySelector("[data-price]").value = r.p; if (r.until) row.querySelector("[data-until]").value = r.until;
      out.innerHTML = `Found <b>${r.p.toFixed(2)}p</b> ex VAT${r.inc ? " (converted from inc VAT)" : ""}${r.until ? " until " + niceDate(r.until) : ""} – check it, then <button data-useprice>Save</button>`;
    }
    if (e.target.matches("[data-useprice]")) setCardPrice(cid, parseFloat(row.querySelector("[data-price]").value), row.querySelector("[data-until]").value);
  });
  const VFIELDS = [["reg", "Registration *", "text"], ["name", "Nickname (optional)", "text"], ["make", "Make", "text"], ["model", "Model", "text"],
    ["year", "Year", "number"], ["type", "Type", VTYPES], ["fuel", "Fuel", VFUELS], ["cc", "Engine size (cc)", "number"], ["gvw", "Gross weight / GVW (kg)", "number"],
    ["euro", "Euro emissions", ["", "Euro 6", "Euro 5", "Euro 4", "Euro 3 or older", "Zero emission"]], ["co2", "CO₂ (g/km)", "number"],
    ["mot", "MOT expiry", "date"], ["tax", "Tax expiry", "date"], ["mpg", "Your own MPG (optional)", "number"]];
  function renderVehTab() {
    const vs = vehicles(), t = todayStr(), soon = d => d && d <= addDays(t, 30);
    const ed = vEdit ? vs.find(v => v.id === vEdit) || {} : { type: "Artic HGV", fuel: "Diesel" };
    $("stVeh").innerHTML = `<p class="note">Add the vehicles you run. Pick one in the filter to see the approximate <b>cost per mile</b> at each station (pump price, and your card price + surcharge).
      Look up the details on GOV.UK (<a href="https://vehicleenquiry.service.gov.uk/" target="_blank" rel="noopener">tax, CO₂, Euro, weight</a> ·
      <a href="https://www.gov.uk/check-mot-history" target="_blank" rel="noopener">MOT history</a>) and copy them in.</p>` +
      vs.map(v => `<div class="vrow" data-vid="${esc(v.id)}"><div class="vt"><span class="reg">${esc(v.reg)}</span><b>${esc(v.name || [v.make, v.model].filter(Boolean).join(" ") || v.type || "")}</b>
        <div class="acts"><button class="lnk" data-vedit>Edit</button><button class="lnk" data-vdel style="color:#b42318">Remove</button></div></div>
        <div class="vd">${[v.year, v.type, v.fuel, v.cc ? (+v.cc).toLocaleString() + " cc" : "", v.gvw ? (+v.gvw).toLocaleString() + " kg GVW" : "", v.euro, v.co2 ? v.co2 + " g/km CO₂" : ""].filter(Boolean).map(esc).join(" · ")}<br>
          ${v.mot ? `MOT <span class="${soon(v.mot) ? "bad" : "ok"}">${v.mot < t ? "EXPIRED" : "until"} ${niceDate(v.mot)}</span> · ` : ""}${v.tax ? `Tax <span class="${soon(v.tax) ? "bad" : "ok"}">${v.tax < t ? "EXPIRED" : "until"} ${niceDate(v.tax)}</span> · ` : ""}
          ${v.fuel === "Electric" ? "Electric" : `<b>${vehMpg(v)}</b> mpg${+v.mpg > 0 ? "" : " (estimate)"}`}</div></div>`).join("") +
      `<div class="vrow"><b>${vEdit ? "Edit vehicle" : "Add a vehicle"}</b><div class="vform">` +
      VFIELDS.map(([k, label, kind]) => `<label>${label}${Array.isArray(kind) ? `<select data-vf="${k}">${kind.map(o => `<option${(ed[k] || "") === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`
        : `<input data-vf="${k}" type="${kind}"${kind === "number" ? ' inputmode="decimal" min="0"' : ""} value="${esc(ed[k] || "")}"${k === "reg" ? ' style="text-transform:uppercase" placeholder="AB12 CDE"' : ""}>`}</label>`).join("") +
      `<div class="est" id="vEst"></div>
       <div class="full"><button class="primary" id="vSave">${vEdit ? "Save changes" : "Add vehicle"}</button>${vEdit ? ' <button id="vCancel">Cancel</button>' : ""}</div></div></div>`;
    const showEst = () => { const v = readVForm(); $("vEst").innerHTML = v.fuel === "Electric" ? "Electric vehicle – no MPG." : `Estimated <b>${estMpg(v)}</b> mpg from its type, weight and engine${+v.mpg > 0 ? ` – using your figure of <b>${+v.mpg}</b> mpg` : ""}.`; };
    $("stVeh").querySelector(".vform").addEventListener("input", showEst); showEst();
    $("vSave").onclick = () => {
      const v = readVForm(); if (!v.reg) { $("vEst").innerHTML = '<span style="color:#b42318">Please enter the registration.</span>'; return; }
      const vs2 = vehicles().slice();
      if (vEdit) { const i = vs2.findIndex(x => x.id === vEdit); if (i >= 0) vs2[i] = Object.assign({}, vs2[i], v); }
      else vs2.push(Object.assign({ id: Date.now().toString(36) }, v));
      vEdit = null; savePrefs({ vehicles: vs2 }); renderVehSel(); renderVehTab(); draw();
    };
    if ($("vCancel")) $("vCancel").onclick = () => { vEdit = null; renderVehTab(); };
  }
  function readVForm() {
    const v = {}; document.querySelectorAll("#stVeh [data-vf]").forEach(el => v[el.dataset.vf] = el.value.trim());
    v.reg = v.reg.toUpperCase().replace(/\s+/g, " "); return v;
  }
  $("stVeh").addEventListener("click", e => {
    const row = e.target.closest("[data-vid]"); if (!row) return; const id = row.dataset.vid;
    if (e.target.matches("[data-vedit]")) { vEdit = id; renderVehTab(); $("stVeh").querySelector(".vform").scrollIntoView({ behavior: "smooth" }); }
    if (e.target.matches("[data-vdel]")) {
      const vs2 = vehicles().filter(v => v.id !== id), part = { vehicles: vs2 }; if (prefs.vehicle === id) part.vehicle = "";
      savePrefs(part); renderVehSel(); renderVehTab(); draw();
    }
  });
  $("mySettings").onclick = () => openSettings();
  $("closeSettings").onclick = () => $("settings").hidden = true;
  $("settings").addEventListener("click", e => { if (e.target === $("settings")) $("settings").hidden = true; });
  document.querySelectorAll("#settings .stabs button").forEach(b => b.onclick = () => { stTab = b.dataset.st; renderSettings(); });

  // ---------- start ----------
  (async function start() {
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(r => r.ok ? r.json() : null).then(t => {
      if (!t || !window.topojson) return;
      const uk = topojson.feature(t, t.objects.countries).features.find(f => f.id === "826");
      if (uk) addMask(uk);
    }).catch(() => {});
    fetch("logos/index.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => logos = j || {}).catch(() => {});
    await Promise.all([loadCards(), loadProviders()]);
    if (!providers.some(p => p.id === selProvider)) selProvider = OTHER.id;
    useProvider();
    try { $("provBox").open = localStorage.getItem("fuelmap-prov-open") === "1"; } catch (e) {}
    try {
      const r = await fetch("data/stations.json?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      meta = await r.json();
      stations = meta.stations || [];
    } catch (e) {
      $("meta").textContent = "No price data published yet – use Admin to upload a Fuel Finder CSV.";
      return;
    }
    matchCards(); renderProviders(); renderVehSel(); draw();
    locate(true);
    const when = new Date(meta.published || meta.updated).toLocaleString("en-GB", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
    $("meta").innerHTML = `${(meta.stations || []).length.toLocaleString()} stations · prices from ${esc(when)}<br>Source: GOV.UK Fuel Finder`;
  })();
})();
</script>
</body>
