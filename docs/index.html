<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2545">
<title>Atlantis Transport – Fuel Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --green:#1e9e4a; --amber:#f0a020; --red:#d63a2f; --grey:#8a8f98; --ink:#1d232b; --panel:#ffffffee;
          --brand:#0b2545; --brand-ink:#ffffff; --bar:54px; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; top:var(--bar); left:0; right:0; bottom:0; background:#dfe6ec; }
  #bar { position:absolute; top:0; left:0; right:0; height:var(--bar); box-sizing:border-box; z-index:1003; display:flex; align-items:center;
         gap:8px; padding:8px 10px; background:var(--brand); color:var(--brand-ink); box-shadow:0 2px 8px #0004; }
  #menuBtn { position:relative; flex:none; width:40px; height:38px; padding:0; font-size:20px; line-height:1; background:transparent;
             color:var(--brand-ink); border:1.5px solid color-mix(in srgb, var(--brand-ink) 45%, transparent); }
  #menuBtn:hover { background:color-mix(in srgb, var(--brand-ink) 12%, transparent); }
  #menuBtn .nf { position:absolute; top:-6px; right:-6px; }
  #brand { flex:none; display:flex; align-items:center; gap:8px; min-width:0; max-width:34%; }
  #brand img { max-height:38px; max-width:160px; object-fit:contain; }
  #brandName { font-weight:800; font-size:16px; letter-spacing:.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #search { flex:1; min-width:0; max-width:420px; margin-left:auto; padding:8px 10px; border:0; border-radius:8px; font-size:15px; }
  #locate { flex:none; height:38px; }
  #drawer { position:absolute; top:var(--bar); right:0; bottom:0; width:290px; max-width:86vw; box-sizing:border-box; z-index:1002;
            background:#fff; box-shadow:-2px 0 12px #0003; padding:12px 14px 18px; overflow-y:auto;
            transform:translateX(105%); transition:transform .2s ease; font-size:14px; }
  #menuBtn { order:10; }   /* PC: menu button sits on the right, next to the menu */
  #drawer.open { transform:none; }
  #drawer .dhead { display:flex; align-items:center; font-weight:800; font-size:15px; margin-bottom:2px; }
  #drawer .dhead button { margin-left:auto; border:0; background:none; font-size:18px; padding:2px 6px; color:#556; }
  #scrim { position:absolute; inset:var(--bar) 0 0 0; z-index:1001; background:#0005; display:none; }
  .nf { font-size:11px; font-weight:700; color:#fff; background:#d63a2f; border-radius:9px; padding:1px 6px; line-height:1.4; }
  .panel { position:absolute; z-index:1000; background:var(--panel); border-radius:10px;
           box-shadow:0 2px 10px #0003; padding:10px 12px; font-size:14px; }
  button { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid #ccd; background:#fff; cursor:pointer; }
  button:hover { background:#f1f4f7; }
  #drawer .lh { font-size:12px; color:#556; margin:12px 0 5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .chips { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .chip { cursor:pointer; --c:#111; }
  .chip.c-unl { --c:#00843d; } .chip.c-adblue { --c:#0067b1; }
  .chip input { position:absolute; opacity:0; pointer-events:none; }
  .chip span { display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 4px; border-radius:8px; font-size:13px;
               font-weight:700; border:2px solid var(--c); color:var(--c); background:#fff; user-select:none; white-space:nowrap; }
  .chip span svg { width:16px; height:16px; flex:none; }
  .chip input:checked + span { background:var(--c); color:#fff; box-shadow:0 1px 3px #0003; }
  .chip input:focus-visible + span { outline:2px solid #1a73e8; outline-offset:2px; }
  .seg { display:grid; grid-template-columns:repeat(3, 1fr); border:2px solid #c9d0d8; border-radius:8px; overflow:hidden; }
  .seg label { cursor:pointer; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span { display:block; text-align:center; padding:6px 2px; font-size:12px; font-weight:600; color:#55606c; background:#fff; }
  .seg label + label span { border-left:1px solid #dde3ea; }
  .seg input:checked + span { background:var(--brand,#0b2545); color:var(--brand-ink,#fff); }
  #cbyNote { font-size:12px; color:#6b7684; margin-top:5px; min-height:0; }
  #cbyNote b { color:#9a4a00; }
  #grad { margin-top:8px; }
  #grad .gbar { height:10px; border-radius:5px; background:linear-gradient(90deg, hsl(120 70% 40%), hsl(60 85% 45%), hsl(0 70% 48%)); }
  #grad.sur .gbar { background:linear-gradient(90deg, hsl(40 85% 46%), hsl(0 85% 46%)); }
  #grad .gnone { display:flex; align-items:center; gap:5px; font-size:12px; color:#445; margin-bottom:6px; }
  #grad .gnone[hidden], #grad .gbar[hidden] { display:none; }
  #grad .gl small { color:#7a8591; font-size:10.5px; }
  #grad .gl { display:flex; justify-content:space-between; font-size:12px; color:#445; margin-top:3px; font-variant-numeric:tabular-nums; }
  .key { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:#445; margin-top:8px; }
  .key span { display:inline-flex; align-items:center; gap:4px; }
  .key span[hidden] { display:none; }
  .key em { font-style:normal; }
  .key b { font-weight:600; color:#667; font-variant-numeric:tabular-nums; }
  #drawer label.small { display:flex; align-items:center; gap:6px; font-size:12px; color:#445; margin-top:6px; cursor:pointer; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; border:1.5px solid #fff; box-shadow:0 0 0 1px #0004; flex:none; }
  #meta { font-size:12px; color:#556; margin-top:6px; line-height:1.4; }
  #listinfo { font-size:12px; margin-top:6px; }
  #listinfo a { color:#0b62c4; cursor:pointer; }
  #status { top:calc(var(--bar) + 8px); left:10px; max-width:360px; display:none; z-index:1004; }
  #drawer .links2 { margin-top:14px; padding-top:10px; border-top:1px solid #e6eaef; font-size:13px; }
  #drawer .links2 a { color:var(--brand); font-weight:600; }
  .pop h3 { margin:0 0 2px; font-size:15px; }
  .pop .head { display:flex; align-items:center; gap:10px; }
  .pop .head img { width:96px; height:48px; object-fit:contain; flex:none; }
  .pop .sub { color:#556; font-size:12px; margin-bottom:6px; }
  @font-face { font-family:"Seg7"; src:url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:"Seg14"; src:url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG14-Classic/DSEG14Classic-Bold.woff2") format("woff2"); font-display:swap; }
  /* forecourt price sign */
  .sign { background:#22272e; border-radius:8px; padding:5px; margin:6px 0 4px; box-shadow:inset 0 0 0 2px #3a414b; }
  .srow { display:flex; align-items:stretch; gap:5px; }
  .srow + .srow { margin-top:5px; }
  .slabel .exv { margin-left:auto; padding-left:6px; font:600 11px/1.1 system-ui, sans-serif; letter-spacing:0; text-transform:none;
                 opacity:.85; text-align:right; white-space:nowrap; }
  .slabel { flex:1; display:flex; align-items:center; padding:0 10px; border-radius:4px; color:#fff;
            font-weight:800; font-size:13px; letter-spacing:.6px; text-transform:uppercase; line-height:1.1; }
  .lcd { position:relative; min-width:118px; box-sizing:border-box; text-align:right; padding:6px 22px 6px 8px; border-radius:4px;
         background:linear-gradient(180deg,#ffe36b 0%,#f6c21c 55%,#eab308 100%); color:#141414;
         box-shadow:inset 0 0 7px rgba(0,0,0,.35); font:26px/1 "Seg7", ui-monospace, monospace; white-space:nowrap; }
  .lcd .ghost { position:absolute; right:22px; top:6px; color:#141414; opacity:.07; pointer-events:none; }
  .lcd .unit { position:absolute; right:6px; bottom:7px; font:700 12px/1 system-ui, sans-serif; }
  .lcd.word { font-family:"Seg14", ui-monospace, monospace; font-size:20px; padding-top:9px; padding-bottom:9px; }
  .lcd.word .ghost { top:9px; }
  .f-diesel  { background:#111; }
  .f-pdiesel { background:#111; color:#f2c94c; }
  .f-b10     { background:#3b3f45; }
  .f-hvo     { background:#1d5a4c; }
  .f-unl     { background:#00843d; }
  .f-sup     { background:#c8102e; }
  .f-adblue  { background:#0067b1; text-transform:none; font-size:14px; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; background:#eef1f4; margin:2px 2px 0 0; }
  .tag.g { background:#d9f2e2; } .tag.a { background:#fdeccc; } .tag.r { background:#f9dcd9; }
  .pop .links { margin-top:6px; font-size:13px; }
  .cards { border:1px solid #e3e8ee; border-radius:6px; margin:6px 0 4px; overflow:hidden; }
  .cards .ch { display:flex; font-size:11px; font-weight:700; color:#556; background:#f3f5f8; padding:3px 8px; text-transform:uppercase; letter-spacing:.3px; }
  .cards .ch span { margin-left:auto; }
  .crow { display:flex; align-items:center; gap:4px; padding:3px 8px; font-size:13px; border-top:1px solid #eef1f4; }
  .crow .cname { font-weight:600; }
  .crow .csur { margin-left:auto; font-variant-numeric:tabular-nums; color:#1e7a3c; font-weight:600; }
  .crow.sel { background:#eef8f1; }
  .crow.no { background:#fff6e5; } .crow.no .csur { color:#9a6200; font-weight:500; }
  .crow .tag { margin:0; }
  .pop .links { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .pop .links a.nav { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:10px;
                      background:#1a73e8; color:#fff !important; box-shadow:0 1px 3px #0004; }
  .pop .links a.nav:hover { background:#1558b0; }
  .pop .links a.tel { color:#1d232b; text-decoration:none; font-variant-numeric:tabular-nums; }
  .crow .cimg { width:30px; height:19px; border-radius:3px; object-fit:cover; flex:none; margin-right:3px; box-shadow:0 0 0 1px #0002; }
  #drawer .lh .hint { text-transform:none; font-weight:500; color:#8a94a0; letter-spacing:0; }
  .cchips { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .cchips[hidden] { display:none; }
  .cchip { position:relative; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 4px 4px;
           border:2px solid #dde3ea; border-radius:8px; background:#fff; text-align:center; font-size:12px; line-height:1.15; }
  .cchip input { position:absolute; opacity:0; pointer-events:none; }
  .cchip img { width:72px; height:45px; object-fit:cover; border-radius:5px; box-shadow:0 1px 2px #0003; }
  .cchip .cn { font-weight:700; }
  .cchip .cc { color:#7a8591; font-size:11px; }
  .cchip.on { border-color:var(--brand,#0b2545); background:#eef3f9; }
  .cchip.on::after { content:"✓"; position:absolute; top:2px; right:5px; font-weight:800; color:var(--brand,#0b2545); }
  .cchip.off { opacity:.45; cursor:default; }
  #unmatched { position:absolute; z-index:1001; inset:40px 10px auto 10px; max-width:520px; max-height:70vh; overflow:auto; display:none; }
  #unmatched li { font-size:13px; }
  /* ---- phones ---- */
  @media (max-width:600px) {
    :root { --bar:50px; }
    .leaflet-control-zoom { display:none; }
    #bar { gap:6px; padding:6px 8px; }
    #menuBtn { width:36px; height:34px; font-size:18px; }
    #brand { max-width:28%; }
    #brand img { max-height:30px; max-width:96px; }
    #brandName { font-size:13px; }
    #brand.has-logo #brandName { display:none; }
    #search { font-size:16px; padding:6px 8px; }
    #locate { height:34px; padding:4px 8px; }
    #status { left:8px; right:8px; max-width:none; }
    #drawer { font-size:13px; left:0; right:auto; box-shadow:2px 0 12px #0003; transform:translateX(-105%); }
    #menuBtn { order:0; }
    #drawer.open + #scrim { display:block; }
    .chip span { padding:6px 3px; font-size:12px; gap:3px; }
    .leaflet-popup-content { margin:9px 11px; }
    .pop h3 { font-size:14px; }
    .pop .sub { font-size:11px; margin-bottom:4px; }
    .pop .head { gap:8px; }
    .pop .head img { width:64px; height:32px; }
    .cchip img { width:56px; height:35px; }
    .cchip { font-size:11px; padding:4px 3px 3px; }
    .pop .id { display:none; }
    .sign { padding:4px; margin:4px 0 3px; }
    .srow + .srow { margin-top:3px; }
    .slabel .exv { font-size:9.5px; }
    .slabel { font-size:11px; padding:0 7px; letter-spacing:.3px; }
    .lcd { font-size:19px; min-width:86px; padding:5px 17px 5px 6px; }
    .lcd .ghost { right:17px; top:5px; }
    .lcd .unit { right:5px; bottom:5px; font-size:10px; }
    .lcd.word { font-size:14px; padding-top:7px; padding-bottom:7px; }
    .lcd.word .ghost { top:7px; }
    .tag { font-size:10px; padding:1px 5px; }
    .pop .links { font-size:12px; margin-top:4px; }
  }
</style>
</head>
<body>
<header id="bar">
  <button id="menuBtn" title="Menu" aria-label="Menu">☰<span class="nf" id="nFilters" hidden></span></button>
  <div id="brand"><img id="brandLogo" alt="" hidden><span id="brandName">Atlantis Transport</span></div>
  <input id="search" type="search" placeholder="Find town, postcode or station…" autocomplete="off">
  <button id="locate" title="Show my location">📍</button>
</header>
<div id="map"></div>
<div id="status" class="panel"></div>

<aside id="drawer">
  <div class="dhead">Filters<button id="closeMenu" aria-label="Close">✕</button></div>
  <div class="lh">Fuel <span class="hint">– stations with any ticked</span></div>
  <div class="chips">
    <label class="chip c-diesel"><input type="checkbox" data-fuel="diesel"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h9a1 1 0 0 1 1 1v16h1v2H3v-2h1V4a1 1 0 0 1 1-1zm2 2v5h6V5zm9.3 1.3 1.4-1.4 3 3a1 1 0 0 1 .3.7V17a2.5 2.5 0 0 1-5 0v-3h-1v-2h2a1 1 0 0 1 1 1v4a.5.5 0 0 0 1 0v-5.6a2.5 2.5 0 0 1-1-2V7.7z"/></svg>Diesel</span></label>
    <label class="chip c-unl"><input type="checkbox" data-fuel="unleaded"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3h9a1 1 0 0 1 1 1v16h1v2H3v-2h1V4a1 1 0 0 1 1-1zm2 2v5h6V5zm9.3 1.3 1.4-1.4 3 3a1 1 0 0 1 .3.7V17a2.5 2.5 0 0 1-5 0v-3h-1v-2h2a1 1 0 0 1 1 1v4a.5.5 0 0 0 1 0v-5.6a2.5 2.5 0 0 1-1-2V7.7z"/></svg>Unleaded</span></label>
    <label class="chip c-adblue"><input type="checkbox" data-fuel="adblue"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>AdBlue</span></label>
  </div>
  <div class="lh">Colour pumps by</div>
  <div class="seg" id="colourBy">
    <label><input type="radio" name="cby" value="card" checked><span>Fuel card</span></label>
    <label><input type="radio" name="cby" value="price"><span>Pump price</span></label>
    <label><input type="radio" name="cby" value="sur"><span>Surcharge</span></label>
  </div>
  <div id="cbyNote"></div>
  <div id="grad" hidden><div class="gnone" hidden><i class="dot" style="background:var(--green)"></i><span id="gNone"></span></div><div class="gbar"></div><div class="gl"><span id="gMin"></span><span id="gMax"></span></div></div>
  <div class="lh" id="cardsHead">Fuel cards <span class="hint">– stations taking any ticked</span></div>
  <div id="cardChips" class="cchips"></div>
  <div id="cardOpts" hidden>
    <label class="small"><input type="checkbox" id="showOthers"> Also show stations that don't take them</label>
    <label class="small"><input type="checkbox" id="hideNoHgv"> Hide sites marked “no HGVs”</label>
  </div>
  <div class="lh">Key</div>
  <div class="key" style="margin-top:0" id="key">
    <span id="k-green"><i class="dot" style="background:var(--green)"></i><em id="kl-green">Takes card</em> <b id="c-green"></b></span>
    <span id="k-amber"><i class="dot" style="background:var(--amber)"></i><em id="kl-amber">Fuel station</em> <b id="c-amber"></b></span>
    <span id="k-red"><i class="dot" style="background:var(--red)"></i><em id="kl-red">No HGVs</em> <b id="c-red"></b></span>
  </div>
  <label class="small"><input type="checkbox" id="showClosed"> Show temporarily closed (<span id="c-grey"></span>)</label>
  <div id="listinfo"></div>
  <div id="meta">Loading…</div>
  <div class="links2"><a href="admin.html">Admin</a></div>
</aside>
<div id="scrim"></div>

<div id="unmatched" class="panel"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="convert.js"></script>
<script>
(function () {
  "use strict";
  const COLORS = { green:"#1e9e4a", amber:"#f0a020", red:"#d63a2f", grey:"#8a8f98" };
  const UK_BOUNDS = L.latLngBounds([49.6, -9.2], [61.1, 2.4]);
  const FUEL_NAMES = {
    B7_STANDARD:"Diesel", B7S:"Diesel", B7:"Diesel", B7_PREMIUM:"Premium diesel", B7P:"Premium diesel",
    B10:"Diesel B10", HVO:"HVO", E10:"Unleaded", E5:"Super unleaded"
  };
  const FUEL_CLASS = {
    B7_STANDARD:"f-diesel", B7S:"f-diesel", B7:"f-diesel", B7_PREMIUM:"f-pdiesel", B7P:"f-pdiesel",
    B10:"f-b10", HVO:"f-hvo", E10:"f-unl", E5:"f-sup"
  };
  const FUEL_ORDER = ["B7_STANDARD","B7S","B7","B7_PREMIUM","B7P","HVO","B10","E10","E5"];
  const AMENITY_NAMES = {
    adblue_pumps:"AdBlue pumps", adblue_packaged:"AdBlue (cans)", lpg_pumps:"LPG", car_wash:"Car wash",
    customer_toilets:"Toilets", water_filling:"Water", air_pump_or_screenwash:"Air/screenwash", twenty_four_hour_fuel:"24h fuel"
  };
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const SMALL = window.matchMedia("(max-width:600px)").matches;
  
  const map = L.map("map", {
    preferCanvas: true, maxBounds: UK_BOUNDS, maxBoundsViscosity: 0.9, minZoom: 5, zoomSnap: 0.5, zoomControl: false
  }).fitBounds([[49.9, -8.2], [60.9, 1.8]]);
  L.control.zoom({ position: "topleft" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Prices: GOV.UK Fuel Finder (OGL v3.0)'
  }).addTo(map);

  const canvas = L.canvas({ padding: 0.3, tolerance: L.Browser.mobile ? 14 : 8 });
  const layer = L.layerGroup().addTo(map);
  let stations = [], markers = [], meta = {}, logos = {};
  let cards = [];          // [{id, name, img, rows:[...]}] from cards/index.json + cards/<id>.csv
  let selCards = new Set();
  const cardImg = c => c.img ? "cards/" + c.img : FuelMap.dummyCardImg(c.name);

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const normPc = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const title = s => String(s || "").toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase());
  function status(msg, ms) {
    const el = $("status"); el.innerHTML = msg; el.style.display = msg ? "block" : "none";
    if (ms) setTimeout(() => { if (el.innerHTML === msg) el.style.display = "none"; }, ms);
  }

  // ---------- fuel card lists (parsing lives in convert.js) ----------
  function matchCards() {
    for (const s of stations) s.cards = {};
    for (const card of cards) {
      const byPc = new Map(), byId = new Map();
      card.rows.forEach(r => {
        r.matched = 0;
        if (r.id) byId.set(r.id, r);
        if (r.pc) { if (!byPc.has(r.pc)) byPc.set(r.pc, []); byPc.get(r.pc).push(r); }
      });
      for (const s of stations) {
        let hit = byId.get(s.id) || null;
        if (!hit) {
          const cands = byPc.get(normPc(s.pc));
          // several list rows on one postcode: pick the one whose name best matches
          if (cands && cands.length) hit = cands.length === 1 ? cands[0] : cands.slice().sort((a, b) => nameScore(b.name, s) - nameScore(a.name, s))[0];
        }
        if (hit) { hit.matched++; s.cards[card.id] = hit; }
      }
      card.unmatched = card.rows.filter(r => !r.matched);
    }
    renderCardChips();
  }
  function renderCardChips() {
    const withList = cards.filter(c => c.rows.length);

        (c.unmatched.length ? ` · <a data-un="${esc(c.id)}">${c.unmatched.length} not matched</a>` : "")).join("<br>");

  }
  function nameScore(name, s) {
    const a = new Set(String(name).toLowerCase().split(/\W+/).filter(w => w.length > 2));
    const b = (s.n + " " + s.b + " " + s.a).toLowerCase();
    let n = 0; a.forEach(w => { if (b.includes(w)) n++; }); return n;
  }
  function showUnmatched(card) {

      <p style="font-size:13px;margin:6px 0">Usually a postcode that differs slightly. Fix the postcode in your list, or add a <code>node_id</code> column with the station's ID (shown at the bottom of each station's popup).</p>
      <ul>${rows.map(r => `<li>${esc(r.name || "(no name)")} – ${esc(r.raw.join(", "))}</li>`).join("")}</ul>

  const exVat = p => (p / 1.2).toFixed(1) + "p";   // pump prices include 20% VAT

  // ---------- colour by: fuel card (default) / pump price / card surcharge ----------
  const cby = () => (document.querySelector('input[name="cby"]:checked') || {}).value || "card";
  const PRICE_KEYS = { diesel: ["B7S", "B7_STANDARD", "B7"], unleaded: ["E10"] };   // standard grades only
  function priceOf(s, fuel) { for (const k of PRICE_KEYS[fuel] || []) if (s.p && s.p[k] != null) return s.p[k]; return null; }
  function surOf(s, card) {
    const r = card && s.cards[card.id]; if (!r) return null;

  const gradCol = t => `hsl(${Math.round(120 * (1 - t))} ${t > .35 && t < .65 ? 85 : 72}% ${t > .35 && t < .65 ? 44 : 41}%)`;
  // only one fuel (price mode) or one card (surcharge mode) at a time
  function enforceSingle(changed) {
    const mode = cby();
    if (mode === "price") {
      const on = [...document.querySelectorAll("[data-fuel]")].filter(c => c.checked);
      const keep = changed && changed.dataset.fuel && changed.checked ? changed : on[0];
      on.forEach(c => { if (c !== keep) c.checked = false; });
    }
    if (mode === "sur") {
      const on = [...selCards].filter(id => (cards.find(c => c.id === id) || {}).rows);
      const keep = changed && changed.dataset.card && changed.checked ? changed.dataset.card : on[0];

  let gradInfo = null;   // {mode, fuel|card} while a gradient is showing
  function recolour() {
    if (!gradInfo) return;
    const b = map.getBounds().pad(0.05), vals = [];
    for (const m of markers) {
      if (!b.contains(m.getLatLng())) { m._v = undefined; continue; }
      m._v = gradInfo.mode === "price" ? priceOf(m.s, gradInfo.fuel) : surOf(m.s, gradInfo.card);
      if (m._v != null) vals.push(m._v);
    }
    // surcharge: none = green, then amber → red for the rest; price: green → red
    const sur = gradInfo.mode === "sur", ranked = sur ? vals.filter(v => v > 0) : vals;
    const lo = Math.min(...ranked), hi = Math.max(...ranked);
    // colour by rank, so one very dear (or cheap) site doesn't squash everyone else into one colour
    const sorted = ranked.slice().sort((a, b) => a - b), rank = new Map();
    sorted.forEach((v, i) => { if (!rank.has(v)) rank.set(v, i); });
    const n = sorted.length, tOf = v => n > 1 && hi > lo ? rank.get(v) / (n - 1) : (sur ? 0 : 0);
    for (const m of markers) {
      if (m._v === undefined) continue;
      const c = m._v == null ? COLORS.grey
              : sur ? (m._v <= 0 ? COLORS.green : `hsl(${Math.round(40 * (1 - tOf(m._v)))} 85% 46%)`)
              : gradCol(tOf(m._v));

    $("grad").hidden = !vals.length;
    if (sur) {
      const none = vals.filter(v => v <= 0).length;
      $("gMin").textContent = ranked.length ? "Lowest " + fmt(lo) : "";
      $("gMax").textContent = ranked.length ? "Highest " + fmt(hi) : "";
      $("gNone").textContent = none ? `No surcharge (${none})` : "";
      $("gNone").parentNode.hidden = !none; $("grad").querySelector(".gbar").hidden = !ranked.length;
    } else {
      $("gNone").parentNode.hidden = true; $("grad").querySelector(".gbar").hidden = false;
      if (vals.length) { $("gMin").innerHTML = `Cheapest ${fmt(lo)} <small>(${exVat(lo)} ex VAT)</small>`; $("gMax").innerHTML = `Dearest ${fmt(hi)} <small>(${exVat(hi)} ex VAT)</small>`; }
    }
  }
  map.on("moveend", recolour);

  // ---------- drawing ----------
  function draw() {
    layer.clearLayers(); markers = [];
    const want = {}; document.querySelectorAll("[data-fuel]").forEach(c => want[c.dataset.fuel] = c.checked);
    const sel = chosenCards(), showClosed = $("showClosed").checked;
    const onlyCard = sel.length > 0 && !$("showOthers").checked, hideNoHgv = sel.length > 0 && $("hideNoHgv").checked;
    const anyFuel = want.diesel || want.unleaded || want.adblue;
    const counts = { green:0, amber:0, red:0, grey:0 };
    // draw amber first so green/red sit on top where they overlap
    const order = { grey:0, amber:1, green:2, red:3 };
    const list = stations.slice().sort((a, b) => order[a.cat] - order[b.cat]);
    stations.forEach(s => s.cat = catFor(s, sel));
    list.sort((a, b) => order[a.cat] - order[b.cat]);
    // colour mode
    const mode = cby(), fuelOn = Object.keys(want).filter(k => want[k]);
    gradInfo = null; let note = "";
    if (mode === "price") {
      if (fuelOn.length !== 1) note = "Pick <b>one fuel</b> above to colour by its price.";
      else if (fuelOn[0] === "adblue") note = "";   // no AdBlue prices in the Fuel Finder data
      else { gradInfo = { mode, fuel: fuelOn[0] }; note = `Standard ${fuelOn[0]} price, for the stations in view. Green = cheapest.`; }
    } else if (mode === "sur") {
      if (sel.length !== 1) note = "Pick <b>one fuel card</b> below to colour by its surcharge.";
      else { gradInfo = { mode, card: sel[0] }; note = `${esc(sel[0].name)} surcharge, for the stations in view. Green = no surcharge, then amber → red for the highest.`; }
    }
    $("cbyNote").innerHTML = note; $("grad").hidden = true;
    $("key").style.display = gradInfo ? "none" : "";
    for (const s of list) {
      counts[s.cat]++;
      if (s.cat === "grey" && !showClosed) continue;
      // fuel: any ticked type; cards: any ticked card
      if (anyFuel && !((want.diesel && hasDiesel(s)) || (want.unleaded && hasUnleaded(s)) ||
                       (want.adblue && (s.am || []).includes("adblue_pumps")))) continue;
      if (onlyCard && !sel.some(c => s.cards[c.id])) continue;
      if (gradInfo && gradInfo.mode === "sur" && !s.cards[gradInfo.card.id]) continue;
      if (hideNoHgv && s.cat === "red") continue;

  const DIESELS = ["B7S", "B7P", "B7_STANDARD", "B7_PREMIUM", "B7", "B10", "HVO"], UNLEADEDS = ["E10", "E5"];

  function radiusFor(z) { return z < 7 ? 5 : z < 9 ? 6.5 : z < 11 ? 8.5 : z < 13 ? 11 : 13; }

  // Fuel-pump shaped marker, drawn on the shared canvas (fast with thousands of stations).

  const PumpMarker = L.CircleMarker.extend({
    _updatePath() {

      if (!r._drawing || this._empty()) return;
      const p = this._point, ctx = r._ctx, u = this._radius / 8, col = this.options.fillColor;
      ctx.save(); ctx.translate(p.x, p.y); ctx.lineJoin = "round"; ctx.lineCap = "round";
      const rr = (x, y, w, hh, rad) => { ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + hh, rad);
        ctx.arcTo(x + w, y + hh, x, y + hh, rad); ctx.arcTo(x, y + hh, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath(); };

  // Directions from the user's current position: Apple Maps on iPhone/iPad, the default

  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const ANDROID = /Android/i.test(navigator.userAgent);
  function navUrl(s) {

    if (ANDROID) return "geo:" + ll + "?q=" + ll + "(" + label + ")";

  }
  const NAV_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M21.7 11.3l-9-9a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/></svg>';

    // fuel cards accepted here (ticked cards first)
    const isSel = c => sel.includes(c);
    const accepted = cards.filter(c => s.cards[c.id]).sort((a, b) => isSel(b) - isSel(a));
    let cardHtml = accepted.map(c => {
      const r = s.cards[c.id];
      return `<div class="crow${isSel(c) ? " sel" : ""}"><img class="cimg" src="${esc(cardImg(c))}" alt=""><span class="cname">${esc(c.name)}</span>` +
             `${r.hgv === false ? '<span class="tag r">No HGVs</span>' : r.hgv === true ? '<span class="tag g">HGV OK</span>' : ""}` +
             `<span class="csur">${r.sur ? esc(r.sur) : "✓"}</span></div>`;
    }).join("");
    cardHtml = sel.filter(c => !s.cards[c.id]).map(c => `<div class="crow no"><img class="cimg" src="${esc(cardImg(c))}" alt=""><span class="cname">${esc(c.name)}</span><span class="csur">not accepted</span></div>`).join("") + cardHtml;
    const cardsBox = cardHtml ? `<div class="cards"><div class="ch">Fuel cards${accepted.some(c => s.cards[c.id].sur) ? '<span>surcharge</span>' : ""}</div>${cardHtml}</div>` : "";

    }

    const logo = logos[FuelMap.brandKey(s.b)];
    return `<div class="pop"><div class="head"><img src="${esc(logo ? "logos/" + logo : FuelMap.GENERIC_LOGO)}" alt=""><div><h3>${esc(title(name))}</h3>
      <div class="sub">${brand ? esc(brand) + " · " : ""}${esc(title(s.a))}${s.c ? ", " + esc(title(s.c)) : ""} ${esc(s.pc)}</div></div></div>
      ${sign}
      ${upd ? `<div class="sub" style="margin-top:4px">Prices updated ${esc(upd)}</div>` : ""}
      ${cardsBox}
      <div>${tags.join("")}</div>${hours}
      <div class="links"><a class="nav" href="${navUrl(s)}" target="_blank" rel="noopener" title="Directions from where you are" aria-label="Directions">${NAV_ICON}</a>
      ${s.ph ? `<a class="tel" href="tel:${esc(s.ph.replace(/\s+/g, ""))}">${esc(s.ph)}</a>` : ""}</div>
      <div class="sub id" style="margin-top:6px;font-size:10px;word-break:break-all">ID ${esc(s.id)}</div></div>`;
  }

  // ---------- UK-only mask ----------
  function addMask(feature) {
    const g = feature.geometry, polys = g.type === "Polygon" ? [g.coordinates] : g.coordinates;
    const world = [[-89, -179], [-89, 179], [89, 179], [89, -179]];
    const holes = polys.map(p => p[0].map(c => [c[1], c[0]]));
    const mask = L.polygon([world, ...holes], {
      renderer: L.svg(), stroke: false, fillColor: "#e9edf1", fillOpacity: 0.85, interactive: false
    });
    const outline = L.polygon(holes, { renderer: L.svg(), color: "#5b6b7c", weight: 1, fill: false, interactive: false });
    function sync() {
      const z = map.getZoom();
      if (z < 10) { mask.addTo(map); outline.addTo(map); } else { mask.remove(); outline.remove(); }
    }
    map.on("zoomend", sync); sync();
  }

  // ---------- search & locate ----------
  $("search").addEventListener("keydown", async e => {
    if (e.key !== "Enter") return;
    const q = e.target.value.trim(); if (!q) return;
    const nq = normPc(q);
    // 1) station postcode / name / town in our own data
    let hits = stations.filter(s => normPc(s.pc).startsWith(nq) && nq.length >= 3);
    if (!hits.length) {
      const lq = q.toLowerCase();
      hits = stations.filter(s => (s.n + " " + s.b + " " + s.c + " " + s.a).toLowerCase().includes(lq));
    }
    if (hits.length) {
      const b = L.latLngBounds(hits.map(s => [s.y, s.x]));
      map.fitBounds(b.pad(0.3), { maxZoom: 14 });
      if (hits.length === 1) setTimeout(() => { const m = markers.find(m => m.s === hits[0]); if (m) m.openPopup(); }, 400);
      status(`${hits.length} station${hits.length > 1 ? "s" : ""} found`, 2500);
      return;
    }
    // 2) any UK place via OpenStreetMap
    try {
      status("Searching…");
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&countrycodes=gb&limit=1&q=" + encodeURIComponent(q));
      const j = await r.json();
      if (j[0]) { map.setView([+j[0].lat, +j[0].lon], 12); status("", 0); }
      else status("Nothing found for “" + esc(q) + "”", 3000);
    } catch (err) { status("Search unavailable right now", 3000); }
  });
  let me = null;
  function locate(auto) {
    if (!navigator.geolocation) { if (!auto) status("Location isn't available in this browser", 3000); return; }
    if (!auto) status("Finding you…");
    navigator.geolocation.getCurrentPosition(p => {
      const ll = L.latLng(p.coords.latitude, p.coords.longitude);
      if (!UK_BOUNDS.contains(ll)) { if (!auto) status("You appear to be outside the UK", 3000); return; }
      if (me) me.remove();
      me = L.circleMarker(ll, { renderer: canvas, radius: 8, color: "#fff", weight: 3, fillColor: "#1769e0", fillOpacity: 1, interactive: false }).addTo(map);
      map.fitBounds(ll.toBounds(32000));   // ~20 miles across
      status("", 0);
    }, () => { if (!auto) status("Couldn't get your location", 3000); }, { enableHighAccuracy: !auto, timeout: 10000, maximumAge: 300000 });
  }

  // ---------- fuel card loading ----------
  async function loadCards() {
    try {
      const r = await fetch("cards/index.json?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const idx = await r.json();
      cards = await Promise.all((idx.cards || []).map(async c => {
        let rows = [];
        if (c.file) try {
          const t = await (await fetch("cards/" + c.file.split("?")[0] + "?v=" + Date.now(), { cache: "no-store" })).text();
          rows = FuelMap.readCardList(t).rows;
        } catch (e) {}
        return { id: c.id, name: c.name, img: c.img || "", rows };
      }));
    } catch (e) { cards = []; }
  }
  // ---------- preferences ----------
  // One object holds everything a user can save: { filters:{...}, ...more later }.
  // Saved in this browser only (local storage) – each phone or PC keeps its own settings.
  const PREFS_LS = "fuelmap-prefs";
  let prefs = {};
  try {
    prefs = JSON.parse(localStorage.getItem(PREFS_LS) || "null") || {};
    if (!prefs.filters) { const old = JSON.parse(localStorage.getItem("fuelmap-filters") || "null"); if (old) prefs.filters = old; }
  } catch (e) { prefs = {}; }

  }
  function applyFilters(f) {
    if (!f) return;
    document.querySelectorAll("[data-fuel]").forEach(c => c.checked = !!(f.want || {})[c.dataset.fuel]);
    const cb = document.querySelector(`input[name="cby"][value="${f.colourBy || "card"}"]`); if (cb) cb.checked = true;
    selCards = new Set(f.cards || (f.card ? [f.card] : []));
    $("showOthers").checked = !!f.showOthers; $("hideNoHgv").checked = !!f.hideNoHgv;
    $("showClosed").checked = !!f.showClosed;
  }
  applyFilters(prefs.filters);
  // ☰ menu: open by default on big screens, closed on phones; remembers your choice
  function setMenu(open, remember) {
    $("drawer").classList.toggle("open", open);
    if (remember) try { localStorage.setItem("fuelmap-menu", open ? "1" : "0"); } catch (e) {}
  }
  let menuOpen = !SMALL;
  try { const v = localStorage.getItem("fuelmap-menu"); if (v !== null && !SMALL) menuOpen = v === "1"; } catch (e) {}
  setMenu(menuOpen, false);
  $("menuBtn").onclick = () => setMenu(!$("drawer").classList.contains("open"), true);
  $("closeMenu").onclick = () => setMenu(false, true);
  $("scrim").onclick = () => setMenu(false, false);
  map.on("click", () => { if (SMALL) setMenu(false, false); });
  document.querySelectorAll("[data-fuel]").forEach(c => c.addEventListener("change", e => { enforceSingle(e.target); draw(); }));
  document.querySelectorAll('input[name="cby"]').forEach(r => r.addEventListener("change", () => { enforceSingle(null); renderCardChips(); draw(); }));
  $("showOthers").addEventListener("change", draw);
  $("hideNoHgv").addEventListener("change", draw);
  $("showClosed").addEventListener("change", draw);

  // ---------- branding (Admin → Branding) ----------
  function applyBranding(b) {
    b = Object.assign({ name: "Atlantis Transport", colour: "#0b2545", logo: "" }, b || {});
    const c = /^#[0-9a-f]{6}$/i.test(b.colour) ? b.colour : "#0b2545";
    const lum = (parseInt(c.slice(1, 3), 16) * 299 + parseInt(c.slice(3, 5), 16) * 587 + parseInt(c.slice(5, 7), 16) * 114) / 1000;
    document.documentElement.style.setProperty("--brand", c);
    document.documentElement.style.setProperty("--brand-ink", lum > 160 ? "#1d232b" : "#ffffff");
    $("brandName").textContent = b.name || "";
    document.title = (b.name ? b.name + " – " : "") + "Fuel Map";
    const img = $("brandLogo");
    if (b.logo) { img.src = b.logo; img.alt = b.name || ""; img.hidden = false; $("brand").classList.add("has-logo"); }
    else { img.hidden = true; $("brand").classList.remove("has-logo"); }
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = c;
  }
  applyBranding();

  // ---------- start ----------
  (async function start() {
    fetch("site.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null)
      .then(applyBranding).catch(() => {});
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(r => r.ok ? r.json() : null).then(t => {
      if (!t || !window.topojson) return;
      const uk = topojson.feature(t, t.objects.countries).features.find(f => f.id === "826");
      if (uk) addMask(uk);
    }).catch(() => {});
    fetch("logos/index.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => logos = j || {}).catch(() => {});
    await loadCards();
    try {
      const r = await fetch("data/stations.json?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      meta = await r.json();
      stations = meta.stations || [];
    } catch (e) {
      $("meta").textContent = "No price data published yet – use Admin to upload a Fuel Finder CSV.";
      return;
    }
    matchCards(); draw();
    locate(true);
    const when = new Date(meta.published || meta.updated).toLocaleString("en-GB", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
    $("meta").innerHTML = `${stations.length.toLocaleString()} stations · prices from ${esc(when)}<br>Source: GOV.UK Fuel Finder`;
  })();
})();
</script>
</body>
</html>
