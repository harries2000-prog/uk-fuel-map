name: Update fuel map

on:
  schedule:
    - cron: "17 5 * * *"     # every morning ~05:17 UTC
    - cron: "17 13 * * *"    # and early afternoon, to catch midday price changes
  push:
    branches: [main]         # e.g. when a new UK Fuels list is uploaded
  workflow_dispatch:         # "Run workflow" button for an on-demand refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download stations and prices from Fuel Finder
        env:
          FF_CLIENT_ID: ${{ secrets.FF_CLIENT_ID }}
          FF_CLIENT_SECRET: ${{ secrets.FF_CLIENT_SECRET }}
        run: python scripts/fetch_stations.py

      - name: Download UK outline
        continue-on-error: true
        run: python scripts/fetch_boundary.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
